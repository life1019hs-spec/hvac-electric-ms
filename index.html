
<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>空調電力單線圖選型系統</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eee5fa;color:#302045;font-family:Arial,"Microsoft JhengHei",sans-serif}
header{background:#58318c;color:white;padding:22px;text-align:center}
header h1{font-size:23px;margin:0 0 8px}
main{max-width:1100px;margin:auto;padding:15px}
section{background:#fff;border:1px solid #d9c4ef;border-radius:15px;padding:18px;margin:14px 0}
h2{font-size:18px;color:#623598;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label{display:block;font-size:14px;font-weight:bold;margin-bottom:5px}
input,select{width:100%;padding:11px;border:1px solid #c5b3d8;border-radius:8px;font-size:16px;background:white}
button{border:0;border-radius:8px;padding:11px 17px;background:#6933a5;color:white;font-size:15px;cursor:pointer;margin:5px 3px 5px 0}
button.alt{background:#796b8a}
button.danger{background:#b33857}
.result{background:#f2e9ff;border-radius:12px;padding:13px;line-height:1.9}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px;border:1px solid #ddd1eb;text-align:left}
th{background:#e5d3f8}
.scroll{overflow-x:auto}
small{color:#655477}
#diagram{width:100%;overflow-x:auto}
svg{display:block;min-width:600px}
@media(max-width:600px){.grid{grid-template-columns:1fr}header h1{font-size:20px}}
@media print{button,section.form{display:none}body{background:white}}
</style>
</head>
<body>
<header>
<h1>鉅鑫空調｜電力單線圖參考系統</h1>
<div>紫色版 · HP / kW / A · PVC / PEX · MS 馬達啟動器</div>
</header>
<main>
<section class="form">
<h2>① 輸入設備資料</h2>
<div class="grid">
<div><label>設備名稱</label><input id="name" value="冰水泵 CHWP-1"></div>
<div><label>設備類型</label><select id="type">
<option>冰水泵</option><option>冷卻水泵</option>
<option>冷卻水塔風車</option><option>空調箱 AHU</option>
<option>送排風機</option><option>冰水主機</option>
<option>其他設備</option></select></div>
<div><label>輸入單位</label><select id="unit">
<option value="HP">馬力 HP</option>
<option value="KW">輸入功率 kW</option>
<option value="A">設備電流 A</option></select></div>
<div><label>數值</label><input type="number" id="value" value="10" min="0" step="any"></div>
<div><label>電壓</label><select id="volt"><option value="380">三相 380V</option><option value="220">三相 220V</option></select></div>
<div><label>極數</label><select id="pole"><option value="4">4P</option><option value="2">2P</option></select></div>
<div><label>電線種類</label><select id="wire">
<option value="PEX">PEX</option><option value="PVC">PVC</option></select></div>
<div><label>供電線制</label><select id="phase">
<option value="3">三相三線 3Φ3W</option>
<option value="4">三相四線 3Φ4W</option></select></div>
<div><label>功率因數（非 HP 查表時使用）</label><input type="number" id="pf" value="0.85" min="0.1" max="1" step="0.01"></div>
<div><label>馬達控制／保護方式</label><select id="ms">
<option value="MS+OL">MS + OL（直接啟動）</option>
<option value="VFD">VFD 變頻器</option>
<option value="NONE">無 MS</option>
</select></div>
<div><label>手動 NFB（AT，留空為自動）</label><input id="manualNfb" type="number" placeholder="自動"></div>
<div><label>手動電源線徑（留空為自動）</label><input id="manualWire" placeholder="例如 PEX14×3"></div>
<div><label>手動接地線（留空為自動）</label><input id="manualGround" placeholder="例如 G5.5"></div>
<div><label>手動配管（留空為自動）</label><input id="manualPipe" placeholder="例如 EMT(39)"></div>
</div>
<div style="margin-top:14px">
<button onclick="add()">＋ 新增設備迴路</button>
<button class="alt" onclick="resetForm()">清除手動規格</button>
</div>
</section>

<section>
<h2>② 自動選型結果</h2>
<div class="result" id="result"></div>
<small>HP 查表的 kW 為馬達輸出功率，並非實際耗電功率。線材和 NFB 為教材式初選。</small>
</section>

<section>
<h2>③ 設備迴路紀錄</h2>
<div class="scroll">
<table>
<thead><tr><th>設備</th><th>電流</th><th>NFB</th><th>控制</th><th>線材</th><th>電源線</th><th>接地線</th><th>配管</th><th>操作</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
<button onclick="downloadCSV()">匯出 CSV</button>
<button onclick="window.print()">列印／PDF</button>
<button class="danger" onclick="clearAll()">清空全部</button>
</section>

<section>
<h2>④ 電力單線圖參考</h2>
<div id="diagram"></div>
<small>單線圖為概念示意。控制器、過載保護、短路保護及開關規格仍須依設備型錄與設計確認。</small>
</section>
</main>

<script>
// 馬達表資料：HP、輸出kW、380V 2P/4P、220V 2P/4P
const motors=[
[0.25,.18,.5,.6,.9,1],
[.5,.37,.9,1,1.5,1.8],
[1,.75,1.7,1.8,3,3],
[2,1.5,3.2,3.3,5.5,5.7],
[3,2.2,4.6,4.6,7.9,7.9],
[5,3.7,7.3,7.7,13,13],
[7.5,5.5,11,11,19,19],
[10,7.5,14,15,25,25],
[15,11,21,22,36,37],
[20,15,28,29,48,51],
[25,18.5,35,36,60,62],
[30,22,40,42,70,73],
[40,30,55,55,95,96],
[50,37,68,72,117,125],
[60,45,83,86,143,149],
[75,55,100,103,172,178],
[100,75,137,135,236,234],
[125,90,162,165,279,256]
];
const ats=[20,30,40,50,60,75,100,125,150,175,200,225,250,275,300,350,400,500,600,700,800,1000,1200];
const sizes={
PEX:{
3:[[5.5,2,20],[8,2,28],[8,5.5,31],[8,5.5,31],[14,5.5,31],[22,8,39],[30,8,51],[38,14,51],[50,14,51],[60,14,63],[80,14,63],[100,22,75],[125,22,75]],
4:[[5.5,2,28],[8,2,28],[8,5.5,31],[14,5.5,39],[14,5.5,39],[22,8,51],[30,8,51],[50,14,63],[60,14,63],[80,14,75],[100,14,75],[125,22,82],[150,22,82]]
},
PVC:{
3:[[5.5,2,20],[8,2,28],[14,5.5,28],[14,5.5,28],[22,5.5,35],[30,8,41],[50,8,41],[80,14,52],[100,14,65],[125,14,65],[150,14,65],[200,22,80]],
4:[[5.5,2,28],[8,2,28],[14,5.5,28],[22,5.5,35],[30,5.5,41],[38,8,41],[60,8,52],[80,14,65],[100,14,65],[150,14,80],[200,14,80]]
}
};
const $=id=>document.getElementById(id);
let items=[];
try{items=JSON.parse(localStorage.getItem('hvac_ms_items')||'[]')}catch(e){}
const fmt=n=>Number(n).toFixed(2);
function calc(){
let unit=$('unit').value,v=Number($('value').value);
let voltage=Number($('volt').value),p=Number($('pole').value);
let pf=Number($('pf').value),motor=null,current=0,kw=0,output=null;
let warning='';
if(!(v>0&&pf>0&&pf<=1))return null;
if(unit==='HP'){
motor=motors.find(m=>m[0]===v);
if(!motor){warning='此馬力不在對照表內；請依設備銘牌提供額定電流。';return {warning}}
output=motor[1];
current=motor[voltage===380?(p===2?2:3):(p===2?4:5)];
kw=output;
}else if(unit==='KW'){
kw=v;
current=v*1000/(Math.sqrt(3)*voltage*pf);
}else{
current=v;
kw=Math.sqrt(3)*voltage*current*pf/1000;
}
let target=current*1.5;
let at=ats.find(n=>n>=target);
let kind=$('wire').value,phase=$('phase').value;
let index=ats.indexOf(at),spec=sizes[kind][phase][index];
let nfb=$('manualNfb').value||at;
let line=spec?`${kind}${spec[0]}×${phase}`:'需人工設計';
let earth=spec?'G'+spec[1]:'需人工設計';
let pipe=spec?(kind==='PEX'?'EMT':'PVC')+'('+spec[2]+')':'需人工設計';
return {
name:$('name').value||$('type').value,
type:$('type').value,
hp:unit==='HP'?v:null,
current,kw,output,
nfb:Number(nfb)||nfb,
ms:$('ms').value,
kind,
line:$('manualWire').value||line,
earth:$('manualGround').value||earth,
pipe:$('manualPipe').value||pipe,
warning:warning||(!at?'電流超出內建NFB表，請人工設計。':!spec?'線徑超出本版內建範圍，請人工設計。':'')
};
}
function preview(){
let r=calc();
if(!r){$('result').textContent='請輸入有效的正數。';return}
if(r.warning&&!r.current){$('result').textContent=r.warning;return}
$('result').innerHTML=`
<strong>參考電流：</strong>${fmt(r.current)} A<br>
<strong>${r.output!==null?'額定輸出功率':'估算輸入功率'}：</strong>${fmt(r.kw)} kW<br>
<strong>NFB：</strong>${r.nfb} AT<br>
<strong>控制方式：</strong>${r.ms}<br>
<strong>電源線：</strong>${r.line}<br>
<strong>接地線：</strong>${r.earth}<br>
<strong>配管：</strong>${r.pipe}
${r.warning?'<br><strong style="color:#b12b47">'+r.warning+'</strong>':''}`;
}
function save(){localStorage.setItem('hvac_ms_items',JSON.stringify(items))}
function add(){
let r=calc();
if(!r||!r.current||r.warning){alert(r?.warning||'請確認資料，超出選型表時不可自動加入。');return}
items.push(r);save();render();
}
function resetForm(){
['manualNfb','manualWire','manualGround','manualPipe'].forEach(id=>$(id).value='');
preview();
}
function removeItem(i){items.splice(i,1);save();render()}
function clearAll(){if(confirm('確定清除全部紀錄？')){items=[];save();render()}}
function downloadCSV(){
let lines=[['設備','電流A','功率kW','NFB','控制','線材','電源線','接地線','配管']];
items.forEach(r=>lines.push([r.name,fmt(r.current),fmt(r.kw),r.nfb,r.ms,r.kind,r.line,r.earth,r.pipe]));
let csv='\ufeff'+lines.map(row=>row.map(c=>'"'+String(c).replaceAll('"','""')+'"').join(',')).join('\r\n');
let a=document.createElement('a');
a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
a.download='HVAC_circuits.csv';a.click();URL.revokeObjectURL(a.href);
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){
$('rows').innerHTML=items.map((r,i)=>`<tr>
<td>${esc(r.name)}</td><td>${fmt(r.current)}A</td>
<td>${esc(r.nfb)}AT</td><td>${esc(r.ms)}</td>
<td>${r.kind}</td><td>${esc(r.line)}</td>
<td>${esc(r.earth)}</td><td>${esc(r.pipe)}</td>
<td><button class="danger" onclick="removeItem(${i})">刪除</button></td></tr>`).join('');
let w=Math.max(600,items.length*175+80);
let h=270;
let svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">
<rect width="${w}" height="${h}" rx="10" fill="#f7f1ff"/>
<path d="M20 49 H${w-20}" stroke="#5b318d" stroke-width="4"/>
<text x="20" y="28" font-size="14" fill="#5b318d">配電盤 BUS BAR</text>`;
items.forEach((r,i)=>{
let x=95+i*175;
svg+=`<g font-family="Arial" fill="#4a2675" text-anchor="middle">
<path d="M${x} 49 V78 M${x} 104 V125 M${x} 155 V192" stroke="#5b318d" stroke-width="2"/>
<rect x="${x-31}" y="78" width="62" height="26" rx="4" fill="white" stroke="#5b318d"/>
<text x="${x}" y="95" font-size="12">NFB ${esc(r.nfb)}</text>
<rect x="${x-31}" y="125" width="62" height="30" rx="4" fill="#e0c7fc" stroke="#5b318d"/>
<text x="${x}" y="144" font-size="12">${esc(r.ms)}</text>
<circle cx="${x}" cy="205" r="13" fill="white" stroke="#5b318d" stroke-width="2"/>
<text x="${x}" y="209" font-size="12">M</text>
<text x="${x}" y="239" font-size="12">${esc(r.name.slice(0,15))}</text>
<text x="${x}" y="255" font-size="11">${fmt(r.current)} A</text></g>`;
});
svg+='</svg>';
$('diagram').innerHTML=items.length?svg:'尚無設備，請先新增迴路。';
}
['value','name','type','unit','volt','pole','wire','phase','pf','ms','manualNfb','manualWire','manualGround','manualPipe'].forEach(id=>{
$(id).addEventListener('input',preview);
$(id).addEventListener('change',preview);
});
preview();render();
</script>
</body>
</html>
